name: Publish Product release

on:
  workflow_run:
    workflows: ['Hosted LibreEcho build and release']
    types: [completed]
  # workflow_run always executes the default-branch (main, 0.14+) copy of this
  # file, which neither publishes 0.13 dev builds nor advances the 0.13 dev
  # pointer. Dispatching this workflow on ref release/0.13.x runs THIS copy:
  # it publishes one verified manual dev build of that branch as an immutable
  # prerelease and, only when advance_pointer is true, replaces
  # radar-puffin-dev-channel/release-pointer.txt. release-pointer-v3.txt (0.14+)
  # is never written. Dispatch with the gh CLI/API so these inputs are used.
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run ID of a successful manual dev run of 'Hosted LibreEcho build and release' on this release branch
        type: string
        required: true
      advance_pointer:
        description: Also advance the 0.13 dev pointer (release-pointer.txt only), after operator validation
        type: boolean
        required: true
        default: false

permissions:
  actions: read
  contents: write

jobs:
  route-publication:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       (github.event.workflow_run.head_branch == 'main' ||
        startsWith(github.event.workflow_run.head_branch, 'release/'))) ||
      (github.event_name == 'workflow_dispatch' &&
       startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      channel: ${{ steps.route.outputs.channel }}
      run_id: ${{ steps.build-run.outputs.run_id }}
      head_sha: ${{ steps.build-run.outputs.head_sha }}
      head_branch: ${{ steps.build-run.outputs.head_branch }}
      build_event: ${{ steps.build-run.outputs.build_event }}
    steps:
      - name: Resolve the exact verified build run
        id: build-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WR_ID: ${{ github.event.workflow_run.id }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          BUILD_RUN_ID: ${{ inputs.build_run_id || '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            run_id="$WR_ID" head_sha="$WR_SHA" head_branch="$WR_BRANCH" build_event="$WR_EVENT"
          else
            [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || {
              echo "ERROR: build_run_id must be a numeric workflow run ID" >&2; exit 1;
            }
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
            jq -e --arg ref "$GITHUB_REF_NAME" --arg repo "$GITHUB_REPOSITORY" '
              .path == ".github/workflows/build-release.yml" and
              .event == "workflow_dispatch" and .status == "completed" and
              .conclusion == "success" and .head_branch == $ref and
              .head_repository.full_name == $repo' <<<"$run_json" >/dev/null || {
              echo "ERROR: run $BUILD_RUN_ID is not a successful manual build of $GITHUB_REF_NAME" >&2; exit 1;
            }
            run_id="$BUILD_RUN_ID"
            head_sha="$(jq -r .head_sha <<<"$run_json")"
            head_branch="$GITHUB_REF_NAME"
            build_event=workflow_dispatch
          fi
          [[ "$run_id" =~ ^[0-9]+$ && "$head_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "ERROR: unresolved build run identity" >&2; exit 1;
          }
          printf 'run_id=%s\nhead_sha=%s\nhead_branch=%s\nbuild_event=%s\n' \
            "$run_id" "$head_sha" "$head_branch" "$build_event" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.build-run.outputs.head_sha }}
          persist-credentials: false
      - id: artifact
        env:
          HEAD_BRANCH: ${{ steps.build-run.outputs.head_branch }}
          HEAD_SHA: ${{ steps.build-run.outputs.head_sha }}
        run: |
          set -euo pipefail
          printf 'name=libreecho-%s-%s\n' "${HEAD_BRANCH#release/}" "${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.build-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.artifact.outputs.name }}
          path: request-artifact
      - id: route
        env:
          HEAD_BRANCH: ${{ steps.build-run.outputs.head_branch }}
          BUILD_EVENT: ${{ steps.build-run.outputs.build_event }}
        run: |
          set -euo pipefail
          python3 build/ci/release_route.py --artifact-root request-artifact \
            --branch "$HEAD_BRANCH" --event "$BUILD_EVENT" | tee route.out
          # A manual publication dispatch is a dev-only path; stable stays on
          # the workflow_run publisher and its stable gates.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            grep -qx 'channel=dev' route.out || {
              echo "ERROR: manual publication dispatch accepts only dev builds" >&2; exit 1;
            }
          fi
          cat route.out >> "$GITHUB_OUTPUT"

  publish-hosted-dev:
    needs: route-publication
    if: needs.route-publication.outputs.channel == 'dev'
    runs-on: ubuntu-24.04
    # public-release is restricted to main; manual 0.13 dispatches run on
    # release/* and use the reviewer-gated dev-release environment instead.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'dev-release' || 'public-release' }}
    concurrency:
      group: publish-hosted-dev-channel
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.route-publication.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve exact verified Product artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.route-publication.outputs.run_id }}
          HEAD_SHA: ${{ needs.route-publication.outputs.head_sha }}
          HEAD_BRANCH: ${{ needs.route-publication.outputs.head_branch }}
        run: |
          set -euo pipefail
          expected="libreecho-${HEAD_BRANCH#release/}-${HEAD_SHA:0:7}"
          mapfile -t matches < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --paginate \
              --jq ".artifacts[] | select(.name == \"$expected\" and .expired == false) | .name"
          )
          test "${#matches[@]}" -eq 1
          printf 'name=%s\n' "${matches[0]}" >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          repository: ${{ github.repository }}
          run-id: ${{ needs.route-publication.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.artifact.outputs.name }}
          path: verified-build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install reviewed OTA verification dependencies
        run: |
          set -euo pipefail
          wheelhouse="$GITHUB_WORKSPACE/build/inputs/reviewed/python-wheels"
          python -m pip install --disable-pip-version-check --no-index \
            --find-links "$wheelhouse" --require-hashes \
            --requirement "$wheelhouse/requirements.txt"
      - name: Prepare development or nightly release
        id: prepare
        env:
          LIBREECHO_OTA_EXPECTED_PUBLIC_KEY_SHA256: ${{ vars.LIBREECHO_OTA_EXPECTED_PUBLIC_KEY_SHA256 }}
          HEAD_SHA: ${{ needs.route-publication.outputs.head_sha }}
          RELEASE_KIND: ${{ needs.route-publication.outputs.build_event == 'schedule' && 'nightly' || 'development' }}
        run: |
          set -euo pipefail
          python3 build/ci/prepare-dev-release.py \
            --artifact-root verified-build \
            --product-commit "$HEAD_SHA" \
            --release-kind "$RELEASE_KIND" \
            --output-dir release-assets | tee prepare-release.out
          grep -E '^(release_tag|release_prefix|source_set_id|artifact_set_id|signed|ota_bundle|asset_count)=' \
            prepare-release.out >>"$GITHUB_OUTPUT"
          test "$(grep -Ec '^(release_tag|release_prefix|source_set_id|artifact_set_id|signed|ota_bundle|asset_count)=' prepare-release.out)" -eq 7
          python3 tools/check-public-metadata.py release-assets
          (cd release-assets && sha256sum -c *-SHA256SUMS)
      - name: Publish development or nightly prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.route-publication.outputs.head_sha }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          RELEASE_KIND: ${{ needs.route-publication.outputs.build_event == 'schedule' && 'nightly' || 'development' }}
          RELEASE_SIGNED: ${{ steps.prepare.outputs.signed }}
          EXPECTED_ASSET_COUNT: ${{ steps.prepare.outputs.asset_count }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          short="${HEAD_SHA:0:7}"
          verify_tag_ref() {
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" |
              jq -e --arg sha "$HEAD_SHA" \
                '.object.type == "commit" and .object.sha == $sha' >/dev/null
          }
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$HEAD_SHA" >/dev/null
          fi
          verify_tag_ref
          while IFS= read -r path; do
            printf '%s\t%s\tsha256:%s\n' \
              "$(basename "$path")" "$(stat -c %s "$path")" "$(sha256sum "$path" | awk '{print $1}')"
          done < <(find release-assets -maxdepth 1 -type f -print | sort) >expected-assets.tsv
          mapfile -t release_ids < <(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | .id")
          test "${#release_ids[@]}" -le 1
          release_id="${release_ids[0]:-}"
          if [[ "$RELEASE_SIGNED" == 1 ]]; then
            release_body=$'Signed development/nightly OTA from verified Product CI.\n\nStatus: PREPARED_NOT_FLASHED. This is a signed dev-channel OTA prerelease and has not received hardware runtime acceptance. Feature policy: community-noncommercial. The wakeword payload remains CC-BY-NC-SA-4.0 (noncommercial and ShareAlike); TTS voice assets remain CC-BY-SA-4.0. Verify SHA256SUMS and the OTA signature before use.'
          else
            release_body=$'Unsigned development/nightly build from verified Product CI.\n\nStatus: PREPARED_NOT_FLASHED. This is not a signed OTA and has not received hardware runtime acceptance. Feature policy: community-noncommercial. The wakeword payload remains CC-BY-NC-SA-4.0 (noncommercial and ShareAlike); TTS voice assets remain CC-BY-SA-4.0. Verify SHA256SUMS before use.'
          fi
          if [[ -z "$release_id" ]]; then
            release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" -f target_commitish="$HEAD_SHA" \
              -f name="LibreEcho development/nightly build $short" \
              -f body="$release_body" \
              -F draft=true -F prerelease=true -f make_latest=false --jq .id)"
          else
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
            jq -e --arg sha "$HEAD_SHA" \
              '.prerelease == true and .target_commitish == $sha' <<<"$release_json" >/dev/null
            if [[ "$(jq -r .draft <<<"$release_json")" == false ]]; then
              gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate \
                --jq '.[] | [.name, (.size|tostring), .digest] | @tsv' | sort >actual-assets.tsv
              cmp expected-assets.tsv actual-assets.tsv
              echo "dev_release=ALREADY_PUBLISHED tag=$tag assets=$(wc -l <actual-assets.tsv)"
              exit 0
            fi
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate --jq '.[].id' |
              while read -r asset_id; do
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >/dev/null
              done
          fi
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -printf '%p\n' | sort)
          [[ "$EXPECTED_ASSET_COUNT" =~ ^[0-9]+$ ]]
          test "${#assets[@]}" -eq "$EXPECTED_ASSET_COUNT"
          gh release upload "$tag" "${assets[@]}"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate \
            --jq '.[] | [.name, (.size|tostring), .digest] | @tsv' | sort >actual-assets.tsv
          cmp expected-assets.tsv actual-assets.tsv
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -F prerelease=true -f make_latest=false >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --jq 'select(.draft == false and .prerelease == true) | .id' | grep -qx "$release_id"
          echo "dev_release=PASS tag=$tag assets=${#assets[@]}"
          if [[ "$RELEASE_KIND" == nightly ]]; then
            while IFS=$'\t' read -r created release_id old_tag; do
              [[ -n "$release_id" ]] || continue
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id" >/dev/null
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$old_tag" >/dev/null
              echo "nightly_retention=DELETED tag=$old_tag created=$created"
            done < <(
              gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
                --jq '.[] | select(.tag_name | startswith("radar-puffin-nightly-")) | [.created_at, (.id|tostring), .tag_name] | @tsv' |
                LC_ALL=C sort -r | tail -n +4
            )
          fi

      - name: Advance verified dev discovery pointer
        # Writes release-pointer.txt (0.13) only. A manual dispatch advances it
        # only when advance_pointer is explicitly true.
        if: >-
          steps.prepare.outputs.signed == '1' &&
          (github.event_name == 'workflow_run' || inputs.advance_pointer == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          HEAD_SHA: ${{ needs.route-publication.outputs.head_sha }}
        run: >-
          python3 build/ci/publish_dev_pointer.py --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG" --head "$HEAD_SHA" --assets release-assets

  publish-stable:
    needs: route-publication
    if: needs.route-publication.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    environment: public-release
    concurrency:
      group: stable-release-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve exact stable Product artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          expected="libreecho-${HEAD_BRANCH#release/}-${HEAD_SHA:0:7}"
          mapfile -t matches < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --paginate \
              --jq ".artifacts[] | select(.name == \"$expected\" and .expired == false) | .name"
          )
          test "${#matches[@]}" -eq 1
          printf 'name=%s\n' "${matches[0]}" >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.artifact.outputs.name }}
          path: verified-build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install reviewed OTA verification dependencies
        run: |
          set -euo pipefail
          wheelhouse="$GITHUB_WORKSPACE/build/inputs/reviewed/python-wheels"
          python -m pip install --disable-pip-version-check --no-index \
            --find-links "$wheelhouse" --require-hashes \
            --requirement "$wheelhouse/requirements.txt"
      - name: Read stable release request
        id: request
        run: |
          set -euo pipefail
          mapfile -t requests < <(find verified-build -name release-request.json -type f -print)
          test "${#requests[@]}" -eq 1
          python3 - "${requests[0]}" >>"$GITHUB_OUTPUT" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          for key in ("channel", "version", "release_tag", "release_notes", "amonet_repository", "amonet_tag", "amonet_commit", "ssh_enabled"):
              value = data.get(key, "")
              if not value:
                  raise SystemExit(f"missing stable release field: {key}")
              print(f"{key}={value}")
          if data["channel"] != "stable":
              raise SystemExit("artifact is not a stable release")
          PY
      - name: Read exact stable source heads
        id: sources
        run: |
          set -euo pipefail
          mapfile -t inventories < <(find verified-build -name release-source-commits.txt -type f -print)
          test "${#inventories[@]}" -eq 1
          python3 - "${inventories[0]}" >>"$GITHUB_OUTPUT" <<'PY'
          import sys
          values = {}
          for line in open(sys.argv[1], encoding="utf-8"):
              if "=" in line:
                  key, value = line.rstrip("\n").split("=", 1)
                  values[key] = value
          for source in ("product", "platform", "linux", "ui"):
              value = values.get(source, "")
              if len(value) != 40 or any(char not in "0123456789abcdef" for char in value):
                  raise SystemExit(f"missing or invalid stable source head: {source}")
              print(f"{source}_head={value}")
          PY
      - name: Prepare signed stable release assets
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_VERSION: ${{ steps.request.outputs.version }}
          RELEASE_NOTES: ${{ steps.request.outputs.release_notes }}
          AMONET_REPOSITORY: ${{ steps.request.outputs.amonet_repository }}
          AMONET_TAG: ${{ steps.request.outputs.amonet_tag }}
          AMONET_COMMIT: ${{ steps.request.outputs.amonet_commit }}
          PRODUCT_HEAD: ${{ steps.sources.outputs.product_head }}
          PLATFORM_HEAD: ${{ steps.sources.outputs.platform_head }}
          LINUX_HEAD: ${{ steps.sources.outputs.linux_head }}
          UI_HEAD: ${{ steps.sources.outputs.ui_head }}
          LIBREECHO_OTA_EXPECTED_PUBLIC_KEY_SHA256: ${{ vars.LIBREECHO_OTA_EXPECTED_PUBLIC_KEY_SHA256 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 build/ci/generate-release-notes.py \
            --version "$RELEASE_VERSION" \
            --product-head "$PRODUCT_HEAD" \
            --platform-head "$PLATFORM_HEAD" \
            --linux-head "$LINUX_HEAD" \
            --ui-head "$UI_HEAD" \
            --output "$RELEASE_NOTES"
          python3 build/ci/prepare-stable-release.py \
            --artifact-root verified-build \
            --product-root "$GITHUB_WORKSPACE" \
            --product-commit "$HEAD_SHA" \
            --release-version "$RELEASE_VERSION" \
            --release-notes "$RELEASE_NOTES" \
            --amonet-repository "$AMONET_REPOSITORY" \
            --amonet-tag "$AMONET_TAG" \
            --amonet-commit "$AMONET_COMMIT" \
            --output-dir release-assets
          python3 tools/check-public-metadata.py release-assets
          (cd release-assets && sha256sum -c *-SHA256SUMS)
      - name: Publish stable Product release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBREECHO_OTA_EXPECTED_PUBLIC_KEY_SHA256: ${{ vars.LIBREECHO_OTA_EXPECTED_PUBLIC_KEY_SHA256 }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          RELEASE_DIR: release-assets
          RELEASE_NOTES: ${{ steps.request.outputs.release_notes }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # make_latest is read from the verified build's release-request.json.
          RELEASE_ARTIFACT_ROOT: verified-build
        run: build/ci/publish-stable-release.sh
