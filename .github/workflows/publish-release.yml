name: Publish merged release

on:
  push:
    branches: [main]
    paths:
      - 'release/*-candidate.json'
  workflow_run:
    workflows: ['Hosted LibreEcho build and release']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish-hosted-dev:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    environment: public-release
    concurrency:
      group: hosted-dev-release-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve exact verified build artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          expected="libreecho-main-${HEAD_SHA:0:7}"
          mapfile -t matches < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --paginate \
              --jq ".artifacts[] | select(.name == \"$expected\" and .expired == false) | .name"
          )
          test "${#matches[@]}" -eq 1
          printf 'name=%s\n' "${matches[0]}" >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.artifact.outputs.name }}
          path: verified-build
      - name: Prepare bounded unsigned dev release
        id: prepare
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python3 build/ci/prepare-dev-release.py \
            --artifact-root verified-build \
            --product-commit "$HEAD_SHA" \
            --output-dir release-assets | tee prepare-release.out
          grep -E '^(release_tag|release_prefix|source_set_id|artifact_set_id)=' \
            prepare-release.out >>"$GITHUB_OUTPUT"
          test "$(grep -Ec '^(release_tag|release_prefix|source_set_id|artifact_set_id)=' prepare-release.out)" -eq 4
          python3 tools/check-public-metadata.py release-assets
          (cd release-assets && sha256sum -c *-SHA256SUMS)
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          short="${HEAD_SHA:0:7}"
          verify_tag_ref() {
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" |
              jq -e --arg sha "$HEAD_SHA" \
                '.object.type == "commit" and .object.sha == $sha' >/dev/null
          }
          while IFS= read -r path; do
            printf '%s\t%s\tsha256:%s\n' \
              "$(basename "$path")" "$(stat -c %s "$path")" "$(sha256sum "$path" | awk '{print $1}')"
          done < <(find release-assets -maxdepth 1 -type f -print | sort) >expected-assets.tsv
          mapfile -t release_ids < <(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | .id")
          test "${#release_ids[@]}" -le 1
          release_id="${release_ids[0]:-}"
          if [[ -z "$release_id" ]]; then
            release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" -f target_commitish="$HEAD_SHA" \
              -f name="LibreEcho development build $short" \
              -f body=$'Unsigned development build from verified hosted CI.\n\nStatus: PREPARED_NOT_FLASHED. This is not a signed OTA and has not received hardware runtime acceptance. Feature policy: community-noncommercial. The wakeword payload remains CC-BY-NC-SA-4.0 (noncommercial and ShareAlike); TTS voice assets remain CC-BY-SA-4.0. Verify SHA256SUMS before use.' \
              -F draft=true -F prerelease=true -f make_latest=false --jq .id)"
            verify_tag_ref
          else
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
            jq -e --arg sha "$HEAD_SHA" \
              '.prerelease == true and .target_commitish == $sha' <<<"$release_json" >/dev/null
            verify_tag_ref
            if [[ "$(jq -r .draft <<<"$release_json")" == false ]]; then
              gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate \
                --jq '.[] | [.name, (.size|tostring), .digest] | @tsv' | sort >actual-assets.tsv
              cmp expected-assets.tsv actual-assets.tsv
              echo "hosted_dev_release=ALREADY_PUBLISHED tag=$tag assets=$(wc -l <actual-assets.tsv)"
              exit 0
            fi
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate --jq '.[].id' |
              while read -r asset_id; do
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >/dev/null
              done
          fi
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -printf '%p\n' | sort)
          test "${#assets[@]}" -eq 14
          gh release upload "$tag" "${assets[@]}"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate \
            --jq '.[] | [.name, (.size|tostring), .digest] | @tsv' | sort >actual-assets.tsv
          cmp expected-assets.tsv actual-assets.tsv
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -F prerelease=true -f make_latest=false >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --jq 'select(.draft == false and .prerelease == true) | .id' | grep -qx "$release_id"
          echo "hosted_dev_release=PASS tag=$tag assets=${#assets[@]}"

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: public-release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Read merged candidate
        id: candidate
        env:
          BUILD_TOKEN: ${{ secrets.LIBREECHO_BUILD_READ_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'release/*-candidate.json')
          test "${#changed[@]}" -eq 1
          candidate="${changed[0]}"
          test -n "$candidate"
          python3 - "$candidate" >>"$GITHUB_OUTPUT" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          for key in ('version','source_run_id','source_run_attempt'):
              if key not in data: raise SystemExit(f'missing candidate field: {key}')
              print(f'{key}={data[key]}')
          channel=data.get('channel','stable')
          if channel not in ('stable','dev'): raise SystemExit('invalid candidate channel')
          print(f'channel={channel}')
          PY
      - name: Download exact Build staging artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          repository: aslater3/LibreEcho-Build
          run-id: ${{ steps.candidate.outputs.source_run_id }}
          github-token: ${{ secrets.LIBREECHO_BUILD_READ_TOKEN }}
          name: community-noncommercial-candidate-${{ steps.candidate.outputs.source_run_id }}-${{ steps.candidate.outputs.source_run_attempt }}
          path: public-release
      - name: Publish bounded assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.candidate.outputs.version }}
          CANDIDATE_CHANNEL: ${{ steps.candidate.outputs.channel }}
        run: |
          set -euo pipefail
          case "$CANDIDATE_CHANNEL" in
            stable|dev) ;;
            *) echo "invalid candidate channel: $CANDIDATE_CHANNEL" >&2; exit 1 ;;
          esac
          dir=public-release/public-release
          test -d "$dir" || dir=public-release
          sums="libreecho-${VERSION}-SHA256SUMS"
          test -f "$dir/$sums"
          ota="libreecho-${VERSION}.ota.tar"
          test -f "$dir/$ota"
          mapfile -t assets < <(find "$dir" -maxdepth 1 -type f ! -name '.assets' -printf '%f\n' | sort)
          test "${#assets[@]}" -ge 4
          printf '%s\n' "${assets[@]}" | grep -qx "libreecho-${VERSION}-boot.img"
          printf '%s\n' "${assets[@]}" | grep -qx "libreecho-${VERSION}-initial-install.tar"
          printf '%s\n' "${assets[@]}" | grep -qx "$sums"
          printf '%s\n' "${assets[@]}" | grep -qx "$ota"
          awk -v ota="$ota" '$2 == ota && length($1) == 64 && $1 !~ /[^0-9a-fA-F]/ { found=1 } END { exit !found }' "$dir/$sums"
          (cd "$dir" && sha256sum -c "$sums")
          if printf '%s\n' "${assets[@]}" | grep -Eiq 'source-offer|provenance|\.spdx\.json|source-closure'; then
            echo 'unexpected compliance asset in public release' >&2; exit 1
          fi
          for alias in stable dev; do
            if [ "$CANDIDATE_CHANNEL" = "$alias" ]; then
              cp "$dir/$ota" "$dir/libreecho-radar-puffin-${alias}.ota.tar"
              assets+=("libreecho-radar-puffin-${alias}.ota.tar")
            fi
          done
          printf '%s\n' "${assets[@]}" | sort -u >"$dir/.assets"
          mapfile -t assets <"$dir/.assets"
          (cd "$dir" && find . -maxdepth 1 -type f ! -name '*-SHA256SUMS' ! -name '.assets' -printf '%f\0' | sort -z | xargs -0 sha256sum >"libreecho-${VERSION}-SHA256SUMS")
          mapfile -t assets < <(find "$dir" -maxdepth 1 -type f ! -name '.assets' -printf '%f\n' | sort)
          tag="$VERSION"
          release_id="$(gh release view "$tag" --json databaseId --jq .databaseId 2>/dev/null || true)"
          if [ -z "$release_id" ]; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "LibreEcho $VERSION" --notes-file "release/${VERSION}.md" --prerelease
            release_id="$(gh release view "$tag" --json databaseId --jq .databaseId)"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.assets[].id' |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" >/dev/null; done
          for asset in "${assets[@]}"; do
            gh release upload "$tag" "$dir/$asset" --clobber
          done
          actual="$(gh release view "$tag" --json assets --jq '.assets | map(.name) | sort | join("\n")')"
          expected="$(printf '%s\n' "${assets[@]}" | sort)"
          test "$actual" = "$expected"
          echo "release_publish=PASS assets=${#assets[@]} tag=$tag"
