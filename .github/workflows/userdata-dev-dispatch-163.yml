name: Dispatch userdata 0.14 dev candidate
on:
  push:
    branches: [fix/0.14-userdata-dev-dispatch-163]
    paths: ['.github/workflows/userdata-dev-dispatch-163.yml']
permissions:
  contents: read
  pull-requests: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'aslater3/LibreEcho' && github.ref == 'refs/heads/fix/0.14-userdata-dev-dispatch-163'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify merged fixes and dispatch the normal dev v2 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          base = 'https://api.github.com/repos/aslater3/'
          def request(path, data=None):
              req = urllib.request.Request(base + path, data=json.dumps(data).encode() if data is not None else None,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None
          sources = {}
          for repository, number, expected_head in (
              ('LibreEcho', 172, '4e15c8a6a2b5e8bd63c381f1f19e1feb1ff45dfa'),
              ('LibreEcho-Platform', 161, 'aa97505965fe32842b3c0e3b0583fa4bacb6b121'),
          ):
              pr = request(f'{repository}/pulls/{number}')
              assert pr['merged'] and pr['base']['ref'] == 'release/0.14.0', f'{repository}: fix is not merged into the requested release'
              assert pr['head']['sha'] == expected_head, f'{repository}: reviewed fix head changed'
              head = request(f'{repository}/git/ref/heads/release/0.14.0')['object']['sha']
              assert head == pr['merge_commit_sha'], f'{repository}: release advanced; re-review before dispatch'
              sources[repository] = head
          inputs = {'update_channel': 'dev', 'ssh_enabled': 'disabled', 'ota_format': 'v2', 'ota_release': '0.14.0',
                    'amonet_repository': 'https://github.com/aslater3/amonet-k32',
                    'amonet_commit': 'dfefe52f0eed7296012707cfff1f753b0ea33257'}
          request('LibreEcho/actions/workflows/build-release.yml/dispatches', {'ref': 'release/0.14.0', 'inputs': inputs})
          print(json.dumps({'dispatched': True, 'ref': 'release/0.14.0', 'inputs': inputs, 'verified_sources': sources}, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Dispatched the existing Hosted LibreEcho build and release workflow for dev OTA v2, release 0.14.0.\n\n')
              for name, commit in sources.items():
                  summary.write(f'- {name}: `{commit}`\n')
              summary.write('\nThe existing publisher remains responsible for validation, signing and prerelease publication. No stable release is changed.\n')
          PY
