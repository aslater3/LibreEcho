name: Prepare 0.13.18 mocked upload boundaries
on:
  push:
    branches: ['fix/0.13.18-installer-upload-176']
    paths: ['.github/workflows/prepare-01318-test-boundaries.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'aslater3/LibreEcho' && github.ref == 'refs/heads/fix/0.13.18-installer-upload-176'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Update existing mocks without weakening integrity assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('tools/test_release_tools.py')
          data = p.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == 'cd844c1aa9ababecee0ebd854f9ca8c7ea3278c3'
          text = data.decode()
          old = '                with mock.patch.object(INSTALLER, "_run_command", side_effect=command):\n'
          new = '''                with mock.patch.object(INSTALLER, "_run_command", side_effect=command), \\
                               mock.patch.object(INSTALLER, "_run_command_with_heartbeat",
                                                 side_effect=lambda argv, timeout, message: command(argv, timeout)):
          '''
          assert text.count(old) == 1
          text = text.replace(old, new.rstrip() + '\n')
          old = '        self.stack.enter_context(mock.patch.object(INSTALLER, "_run_command", side_effect=self.command))\n'
          new = old + '''        self.stack.enter_context(mock.patch.object(
                      INSTALLER, "_run_command_with_heartbeat",
                      side_effect=lambda argv, timeout, message: self.command(argv, timeout)))
          '''
          assert text.count(old) == 1
          p.write_text(text.replace(old, new.rstrip() + '\n'))
          PY
          python -m pip install --disable-pip-version-check --no-index --find-links build/inputs/reviewed/python-wheels --require-hashes -r build/inputs/reviewed/python-wheels/requirements.txt
          timeout 120s python -B -m unittest tools.test_release_tools.FeatureStagingIntegrityTests tools.test_release_tools.OneShotContinuationTests tools.test_feature_upload_timeout -v
          python -m py_compile tools/test_release_tools.py
          git diff --check
          git add tools/test_release_tools.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: keep staging and resume transports fully mocked'
          git push origin "HEAD:$GITHUB_REF_NAME"
