name: Prepare 0.13.18 signing release identity
on:
  push:
    branches: ['fix/0.13.18-signing-release-identity']
    paths: ['.github/workflows/prepare-01318-signing-identity.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install reviewed test dependencies
        run: timeout 60s python -m pip install --no-index --find-links build/inputs/reviewed/python-wheels --require-hashes -r build/inputs/reviewed/python-wheels/requirements.txt
      - name: Update exact release guards and run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = fix/0.13.18-signing-release-identity
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess, sys
          pins = {
              'build/ci/sign_ota_candidate.py': 'b20ad6ea33bf201bd7b9e57bff06c7708ca337369d3d427cead62721a1229654',
              'build/ci/ota_v2_inputs.py': 'a03acb208def2ad26e9235babb25cdd054a102015f5407c64c1a08ee5eca7561',
              'build/tests/test_ota_v2_signing.py': '9a3a1ed5713aec306d3505f4f2cb4ca7d113d142565c44b07c79cbb5537d8880',
          }
          for name, expected in pins.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          legacy = Path('build/ci/sign_ota_candidate_0_13_14.py').read_bytes()
          path = Path('build/tests/test_ota_v2_signing.py')
          source = path.read_text()
          marker = 'class OtaV2InputTests(unittest.TestCase):\n'
          assert source.count(marker) == 1
          regression = '''    def test_01318_signing_and_input_guards_share_the_release_identity(self) -> None:
                  import ota_v2_inputs as inputs
                  import sign_ota_candidate as signer
                  self.assertEqual(inputs.EXPECTED_RELEASE, "0.13.18")
                  self.assertEqual(signer.EXPECTED_RELEASE, "0.13.18")
                  self.assertEqual(signer._impl.EXPECTED_RELEASE, "0.13.18")
                  with tempfile.TemporaryDirectory() as directory:
                      path = Path(directory) / "handoff.json"
                      path.write_text('{"schema":"wrong"}')
                      # Implicit calls must reach the unchanged schema gate.
                      with self.assertRaisesRegex(HandoffError, "schema mismatch"):
                          signer.validate_handoff(path)
                      for stale in ("0.13.17", "0.14.0"):
                          with self.subTest(release=stale), self.assertRaisesRegex(
                              HandoffError, "release must be 0.13.18"
                          ):
                              signer.validate_handoff(path, stale)

          '''
          # Normalise the function body to the existing four-space class style.
          lines = regression.splitlines(True)
          regression = lines[0] + ''.join(line[8:] if line.startswith('        ') else line for line in lines[1:])
          path.write_text(source.replace(marker, marker + regression))
          result = subprocess.run([sys.executable, '-B', '-m', 'unittest',
              'build.tests.test_ota_v2_signing.OtaV2InputTests.test_01318_signing_and_input_guards_share_the_release_identity', '-v'],
              text=True, capture_output=True, timeout=60)
          print(result.stdout, result.stderr)
          assert result.returncode == 1 and 'AssertionError' in result.stderr, 'expected failing release identity regression'
          print('BASELINE_RELEASE_IDENTITY=FAIL_AS_EXPECTED')
          for name in pins:
              path = Path(name)
              text = path.read_text()
              if name.endswith('test_ota_v2_signing.py'):
                  text = text.replace(regression, 'RELEASE_IDENTITY_REGRESSION_PLACEHOLDER\n')
                  text = text.replace('0.13.17', '0.13.18')
                  text = text.replace('RELEASE_IDENTITY_REGRESSION_PLACEHOLDER\n', regression)
              else:
                  text = text.replace('0.13.17', '0.13.18')
              path.write_text(text)
          assert Path('build/ci/sign_ota_candidate_0_13_14.py').read_bytes() == legacy
          subprocess.run([sys.executable, '-B', '-m', 'unittest',
              'build.tests.test_ota_v2_signing.OtaV2InputTests', '-v'], check=True, timeout=60)
          print('RELEASE_IDENTITY=PASS; LEGACY_SIGNER_UNCHANGED=PASS')
          PY
          python -m py_compile build/ci/sign_ota_candidate.py build/ci/ota_v2_inputs.py build/tests/test_ota_v2_signing.py
          git diff --check
          git add build/ci/sign_ota_candidate.py build/ci/ota_v2_inputs.py build/tests/test_ota_v2_signing.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bind protected OTA signing to release 0.13.18'
          timeout 30s git push origin "HEAD:$GITHUB_REF_NAME"
