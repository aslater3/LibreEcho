name: Inspect 0.13.18 signing source
on:
  push:
    branches: ['fix/0.13.18-release-dispatch']
    paths: ['.github/workflows/inspect-01318-signing.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 89ec0c4bb533e767dd3d1f4aca4e800908a7bc95
          persist-credentials: false
      - name: Collect tracked public source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 89ec0c4bb533e767dd3d1f4aca4e800908a7bc95
          mkdir "$RUNNER_TEMP/signing-source"
          git ls-files 'build/*.sh' 'build/ci/*.py' 'build/ci/*.sh' 'build/tests/*.py' 'tools/test_build_release_workflow.py' '.github/workflows/build-release.yml' | while IFS= read -r path; do
            mkdir -p "$RUNNER_TEMP/signing-source/$(dirname "$path")"
            git show "HEAD:$path" > "$RUNNER_TEMP/signing-source/$path"
          done
          git rev-parse HEAD > "$RUNNER_TEMP/signing-source/COMMIT"
          grep -nE 'sign_ota_v2|plan_ota_v2|update-direct|create-handoff|materialize_feature|sign_ota_candidate|signing.handoff' build/build.sh build/ci/*.py build/ci/*.sh || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-signing-source-89ec0c4
          path: ${{ runner.temp }}/signing-source
          include-hidden-files: true
          retention-days: 1
