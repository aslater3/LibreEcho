name: issue-162-hotfix

on:
  push:
    branches:
      - fix/issue-162-v2-inventory

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-162-v2-inventory
          fetch-depth: 0

      - name: Apply focused OTA v2 inventory fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          installer = Path('tools/libreecho-install.py')
          source = installer.read_text(encoding='utf-8')

          old = 'RELEASE = re.compile(r"radar-puffin-(?:v[0-9]+\\.[0-9]+\\.[0-9]+|(?:nightly|build)-[0-9a-f-]+)")\nPUBLIC_NAME = re.compile(r"[A-Za-z0-9._-]+")'
          new = 'RELEASE = re.compile(r"radar-puffin-(?:v[0-9]+\\.[0-9]+\\.[0-9]+|(?:nightly|build)-[0-9a-f-]+)")\nVERSION = re.compile(r"[0-9]+\\.[0-9]+\\.[0-9]+")\nPUBLIC_NAME = re.compile(r"[A-Za-z0-9._-]+")'
          if source.count(old) != 1:
              raise SystemExit('VERSION insertion anchor changed')
          source = source.replace(old, new, 1)

          helper = '''def _v2_metadata_assets(release_dir: Path, prefix: str, release_tag: str) -> set[str]:
              """Checksum-covered OTA v2 metadata and signed replacement asset names.

              A published OTA v2 release adds the signed feature asset inventory, its
              binding feature plan, and every feature replacement asset to the release's
              ``SHA256SUMS`` beyond the initial-install set. The inventory is the
              authoritative list of those extra names, so validate it here and allow only
              what it names rather than accepting arbitrary checksum-covered files.
              Releases without the inventory contribute nothing.
              """
              inventory_path = release_dir / f"{prefix}-feature-assets.json"
              if not inventory_path.exists():
                  return set()
              _safe_regular(inventory_path)
              plan_path = release_dir / f"{prefix}-feature-plan.json"
              _safe_regular(plan_path)
              try:
                  inventory = json.loads(inventory_path.read_text(encoding="utf-8"))
              except (OSError, ValueError) as error:
                  raise InstallerError("published feature asset inventory is unreadable") from error
              if (not isinstance(inventory, dict)
                      or inventory.get("schema") != "libreecho-product-feature-assets-v1"
                      or inventory.get("transaction_type") != "system"
                      or inventory.get("activation") != "reboot"):
                  raise InstallerError("published feature asset inventory is invalid")
              if not release_tag.startswith("radar-puffin-v"):
                  raise InstallerError("published feature asset inventory needs a stable release")
              version = release_tag.removeprefix("radar-puffin-v")
              if not VERSION.fullmatch(version) or inventory.get("release") != version:
                  raise InstallerError("published feature asset inventory is invalid")
              assets = inventory.get("assets")
              if not isinstance(assets, list):
                  raise InstallerError("published feature asset inventory is malformed")
              names = {plan_path.name, inventory_path.name}
              for item in assets:
                  name = item.get("name") if isinstance(item, dict) else None
                  if (not isinstance(name, str) or not name
                          or Path(name).name != name or not PUBLIC_NAME.fullmatch(name)):
                      raise InstallerError("published feature asset inventory is malformed")
                  names.add(name)
              return names


          '''
          anchor = 'def _prepare(release_dir: Path, cache_root: Path, release_tag: str) -> tuple[dict[str, Any], Path]:\n'
          if source.count(anchor) != 1:
              raise SystemExit('_prepare insertion anchor changed')
          source = source.replace(anchor, helper + anchor, 1)

          old = '    if release_tag.startswith("radar-puffin-v"):\n        optional.add("libreecho-radar-puffin-stable.ota.tar")\n    unexpected = set(records) - expected - optional\n'
          new = '    if release_tag.startswith("radar-puffin-v"):\n        optional.add("libreecho-radar-puffin-stable.ota.tar")\n    optional |= _v2_metadata_assets(release_dir, prefix, release_tag)\n    unexpected = set(records) - expected - optional\n'
          if source.count(old) != 1:
              raise SystemExit('_prepare optional-set anchor changed')
          source = source.replace(old, new, 1)
          installer.write_text(source, encoding='utf-8')

          tests = Path('tools/test_initial_installer_publication.py')
          test_source = tests.read_text(encoding='utf-8')
          marker = '    def test_stable_release_publishes_checksum_covered_wrapper(self) -> None:\n'
          if test_source.count(marker) != 1:
              raise SystemExit('test insertion anchor changed')
          regression_body = r'''def test_prepare_accepts_stable_v2_feature_inventory(self) -> None:
              spec = importlib.util.spec_from_file_location("installer_v2", INSTALLER)
              self.assertIsNotNone(spec)
              self.assertIsNotNone(spec.loader)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              tag = "radar-puffin-v0.14.0"
              prefix = f"libreecho-{tag}"
              release_name = tag.removeprefix("radar-puffin-v")
              bundle_name = f"{prefix}-initial-install.tar"
              replacement = f"libreecho-radar-puffin-{release_name}-assistant.runtime.squashfs"

              def build(extra_files, asset_names) -> dict:
                  files = {
                      f"{prefix}-boot.img": b"boot",
                      f"{prefix}-ota-public-key.hex": b"a" * 64 + b"\n",
                      f"{prefix}-release-notes.md": b"notes\n",
                      f"{prefix}-installer.py": b"#!/usr/bin/env python3\n",
                      f"{prefix}.ota.tar": b"signed ota",
                      "libreecho-radar-puffin-stable.ota.tar": b"signed ota",
                      f"{prefix}-build.json": b'{"ota_format": "v2"}\n',
                      f"{prefix}-run-one-shot.sh": b"#!/usr/bin/env bash\n",
                  }
                  inventory = {
                      "schema": "libreecho-product-feature-assets-v1",
                      "transaction_type": "system",
                      "activation": "reboot",
                      "release": release_name,
                      "source_commit": "4" * 40,
                      "assets": [
                          {
                              "feature_id": "assistant", "action": "runtime", "kind": "payload",
                              "name": name, "size": len(data),
                              "sha256": hashlib.sha256(data).hexdigest(),
                          }
                          for name, data in asset_names.items()
                      ],
                  }
                  files[f"{prefix}-feature-assets.json"] = (
                      json.dumps(inventory, sort_keys=True) + "\n").encode()
                  files[f"{prefix}-feature-plan.json"] = (
                      b'{"schema": "libreecho-product-feature-plan-v1"}\n')
                  files.update(asset_names)
                  files.update(extra_files)
                  return files

              manifest = {
                  "schema": "libreecho-initial-install-v1",
                  "release": tag,
                  "board": "radar_puffin",
                  "soc": "mt8163",
                  "image_profile": "ota",
                  "service_profile": "production",
                  "boot": {"name": f"{prefix}-boot.img", "size": 4, "sha256": hashlib.sha256(b"boot").hexdigest()},
                  "ota_public_key": {"name": f"{prefix}-ota-public-key.hex", "size": 65, "sha256": hashlib.sha256(b"a" * 64 + b"\n").hexdigest()},
                  "features": [],
                  "amonet": {"repository": "https://github.com/example/amonet", "tag": "v1", "commit": "a" * 40},
              }

              def materialize(release: Path, files: dict) -> Path:
                  bundle = release / bundle_name
                  with tarfile.open(bundle, "w") as archive:
                      info = tarfile.TarInfo("manifest.json")
                      data = json.dumps(manifest).encode()
                      info.size = len(data)
                      archive.addfile(info, __import__("io").BytesIO(data))
                      for name in (f"{prefix}-boot.img", f"{prefix}-ota-public-key.hex"):
                          info = tarfile.TarInfo(name)
                          info.size = len(files[name])
                          archive.addfile(info, __import__("io").BytesIO(files[name]))
                  files[bundle_name] = bundle.read_bytes()
                  for name, data in files.items():
                      if name != bundle_name:
                          (release / name).write_bytes(data)
                  sums = release / f"{prefix}-SHA256SUMS"
                  sums.write_text("".join(
                      f"{hashlib.sha256((release / name).read_bytes()).hexdigest()}  {name}\n"
                      for name in sorted(files)), encoding="ascii")
                  return bundle

              with tempfile.TemporaryDirectory() as temporary:
                  root = Path(temporary)
                  release = root / "release"
                  release.mkdir()
                  files = build({}, {replacement: b"replacement"})
                  materialize(release, files)
                  prepared, _ = module._prepare(release, root / "cache", tag)
                  self.assertEqual(prepared["release"], tag)

              with tempfile.TemporaryDirectory() as temporary:
                  root = Path(temporary)
                  release = root / "release"
                  release.mkdir()
                  files = build({f"{prefix}-sneaky.bin": b"x"}, {replacement: b"replacement"})
                  materialize(release, files)
                  with self.assertRaises(module.InstallerError):
                      module._prepare(release, root / "cache", tag)

              with tempfile.TemporaryDirectory() as temporary:
                  root = Path(temporary)
                  release = root / "release"
                  release.mkdir()
                  files = build({}, {replacement: b"replacement"})
                  files[f"{prefix}-feature-assets.json"] = b'{"schema": "wrong"}\n'
                  materialize(release, files)
                  with self.assertRaises(module.InstallerError):
                      module._prepare(release, root / "cache", tag)
          '''
          regression_body = textwrap.dedent(regression_body).strip('\n')
          regression = textwrap.indent(regression_body, '    ') + '\n\n'
          test_source = test_source.replace(marker, regression + marker, 1)
          tests.write_text(test_source, encoding='utf-8')
          PY

          sha256sum tools/libreecho-install.py | awk '{print $1 "  libreecho-install.py"}' > tools/libreecho-install.py.sha256

          python3 -m py_compile tools/libreecho-install.py tools/test_initial_installer_publication.py
          python3 -m unittest tools.test_initial_installer_publication.InitialInstallerPublicationTests

      - name: Commit focused hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/libreecho-install.py tools/libreecho-install.py.sha256 tools/test_initial_installer_publication.py
          git commit -m 'fix(installer): accept signed OTA v2 feature inventory'
          git push origin HEAD:fix/issue-162-v2-inventory
