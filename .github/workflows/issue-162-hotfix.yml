name: issue-162-hotfix

on:
  push:
    branches:
      - fix/issue-162-v2-inventory

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-162-v2-inventory
          fetch-depth: 0

      - name: Replay reviewed OTA v2 inventory fix
        shell: bash
        run: |
          git show 8b0beee1af63cc26856e926eacd189523816c393 --format= -- \
            tools/libreecho-install.py \
            tools/test_initial_installer_publication.py | git apply -3

          sha256sum tools/libreecho-install.py | \
            awk '{print $1 "  libreecho-install.py"}' > tools/libreecho-install.py.sha256

          python3 -m py_compile \
            tools/libreecho-install.py \
            tools/test_initial_installer_publication.py
          python3 -m unittest \
            tools.test_initial_installer_publication.InstallerPublicationTests

      - name: Commit focused hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/libreecho-install.py \
            tools/libreecho-install.py.sha256 \
            tools/test_initial_installer_publication.py
          git commit -m 'fix(installer): accept signed OTA v2 feature inventory'
          git push origin HEAD:fix/issue-162-v2-inventory
