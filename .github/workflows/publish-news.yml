name: Publish LibreEcho News feed

# Builds news-v1.json for the dashboard's LibreEcho News panel (#121) from the
# published stable releases plus news/entries.json, validates it with the same
# rules the device applies (tools/check-news.py), and uploads it as asset
# `news-v1.json` on the `news-feed` release. Devices read
#   https://dl.libreecho.org/news/news-v1.json                       (primary)
#   https://github.com/<repo>/releases/download/news-feed/news-v1.json (fallback)
# This workflow publishes the GitHub fallback only; see docs/RELEASING.md,
# "LibreEcho News feed", for what the dl.libreecho.org path needs.
#
# workflow_run and workflow_dispatch both run this file from the default
# branch, so it becomes active once it reaches `main`.

on:
  workflow_run:
    workflows: ['Publish Product release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-news-feed
  cancel-in-progress: false

env:
  NEWS_TAG: news-feed
  NEWS_ASSET: news-v1.json

jobs:
  build-feed:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.11'}
      - name: Collect published releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The shape generate-news.py reads: `gh release list --json
          # tagName,name,publishedAt,isPrerelease,isDraft` plus url and body.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | {tagName: .tag_name, name: (.name // ""), publishedAt: (.published_at // ""),
                         isPrerelease: .prerelease, isDraft: .draft,
                         url: .html_url, body: (.body // "")}' | jq -s . > releases.json
          jq -e 'type == "array" and length > 0' releases.json >/dev/null
      - name: Generate news-v1.json
        run: |
          set -euo pipefail
          mkdir feed
          python3 build/ci/generate-news.py --releases releases.json \
            --entries news/entries.json --out "feed/$NEWS_ASSET"
      - name: Validate with the device rules
        run: python3 tools/check-news.py "feed/$NEWS_ASSET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: news-feed
          path: feed/news-v1.json
          if-no-files-found: error
          retention-days: 7

  publish-feed:
    needs: build-feed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: news-feed
          path: feed
      - name: Upload news-v1.json to the news-feed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          feed="feed/$NEWS_ASSET"
          # Re-validate the exact bytes that are about to be published.
          python3 tools/check-news.py "$feed"

          # The feed release is a prerelease that is never "latest": it carries
          # no firmware, generate-news.py skips prereleases, and the R2 mirror
          # only syncs radar-puffin-* tags.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$NEWS_TAG" >release.json 2>/dev/null; then
            echo "news-feed release exists"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$NEWS_TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="LibreEcho News feed (not a firmware release)" \
              -f body=$'Data feed for the dashboard LibreEcho News panel. It holds only news-v1.json, regenerated by the "Publish LibreEcho News feed" workflow. This is not a firmware release: do not install anything from it.' \
              -F draft=false -F prerelease=true -f make_latest=false >release.json
          fi
          jq -e --arg tag "$NEWS_TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == true' release.json >/dev/null
          release_id="$(jq -r .id release.json)"

          # Skip the upload when the published items are already identical
          # (only the generated timestamp would change).
          mkdir current
          if gh release download "$NEWS_TAG" --repo "$GITHUB_REPOSITORY" \
               --pattern "$NEWS_ASSET" --dir current 2>/dev/null &&
             cmp -s <(jq -S .items "current/$NEWS_ASSET") <(jq -S .items "$feed"); then
            echo "news_feed=UNCHANGED items=$(jq '.items | length' "$feed")"
            exit 0
          fi

          gh release upload "$NEWS_TAG" "$feed" --repo "$GITHUB_REPOSITORY" --clobber
          want="sha256:$(sha256sum "$feed" | awk '{print $1}')"
          got="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate \
            --jq ".[] | select(.name == \"$NEWS_ASSET\") | .digest")"
          test "$got" = "$want"
          echo "news_feed=PUBLISHED items=$(jq '.items | length' "$feed") digest=$want"
      - name: Verify the device URLs
        run: |
          set -euo pipefail
          # The GitHub fallback must serve exactly the published bytes.
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 5 --retry-delay 5 \
            --max-time 60 -o public.json \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$NEWS_TAG/$NEWS_ASSET"
          python3 tools/check-news.py public.json
          cmp -s <(jq -S .items public.json) <(jq -S .items "feed/$NEWS_ASSET")
          echo "github_fallback=PASS"
          # The primary URL is served by the dl.libreecho.org Worker
          # (LibreEcho-Installer-Web mirror/); report it without failing.
          if curl -fsSL --proto '=https' --max-time 30 -o primary.json \
               "https://dl.libreecho.org/news/$NEWS_ASSET" &&
             cmp -s <(jq -S .items primary.json) <(jq -S .items "feed/$NEWS_ASSET"); then
            echo "dl_primary=PASS"
          else
            echo "::warning::https://dl.libreecho.org/news/$NEWS_ASSET does not serve this feed; devices fall back to the GitHub release asset. See docs/RELEASING.md (LibreEcho News feed)."
          fi
