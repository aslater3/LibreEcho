name: Materialise pogo plug v5 package

on:
  push:
    branches:
      - tools/pogo-plug-v5
    paths:
      - .github/workflows/pogo-v5-materialise.yml

permissions:
  contents: write

jobs:
  build-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: tools/pogo-plug-v5

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad zip

      - name: Build and commit v5 package
        shell: bash
        run: |
          set -euo pipefail

          SRC="tools/.pogo-v5-upload/echo_gen2_pogo_plug_v5.scad"
          PKG="$RUNNER_TEMP/libreecho_echo_gen2_pogo_plug_v5"
          ZIP_PATH="tools/libreecho-echo-gen2-pogo-plug-v5.zip"

          rm -rf "$PKG"
          mkdir -p "$PKG/STL" "$PKG/Source"
          cp "$SRC" "$PKG/Source/echo_gen2_pogo_plug_0p4mm_nozzle_v5.scad"

          for bore in 0.80 0.90 1.00 1.10 1.20; do
            tag="${bore/./p}"
            openscad --export-format binstl \
              -D '$fn=24' \
              -D 'part="plug"' \
              -D "pin_bore_d=$bore" \
              -o "$PKG/STL/echo_gen2_pogo_plug_0p4nozzle_flared_bore${tag}.stl" \
              "$SRC"
          done

          openscad --export-format binstl \
            -D '$fn=24' \
            -D 'part="coupon"' \
            -o "$PKG/STL/echo_gen2_pogo_flared_bore_coupon_0p8_to_1p2.stl" \
            "$SRC"

          cat > "$PKG/README.md" <<'EOF'
          # LibreEcho Echo Gen 2 pogo plug — v5

          3D-printable replacement carrier for the six pogo pins exposed through the Echo 2nd Gen base/service plug.

          Measured/design geometry:

          - rounded-rectangle plug
          - 2 × 3 pogo layout on 3.0 mm pitch
          - measured pogo barrel diameter: approximately 0.66 mm
          - 10.0 × 7.6 mm clearance lid
          - 8.8 × 6.0 mm insert body
          - 5.0 mm insert depth below the 2.0 mm lid
          - flared through-bores intended to slice reliably with a 0.4 mm FDM nozzle

          The package contains 0.80, 0.90, 1.00, 1.10 and 1.20 mm central-bore plug variants, a calibration coupon, and the parametric OpenSCAD source.

          For a 0.4 mm nozzle, print the calibration coupon first. The 1.00 mm model is the recommended initial carrier for a measured 0.66 mm pogo barrel. Retain the pins at the wiring-side pocket with a very small amount of epoxy or UV resin, kept away from the moving pogo plunger.

          The repository package uses binary STL encoding and 24-segment tessellation. That is substantially finer than the useful resolution of a 0.4 mm nozzle while avoiding unnecessary Git repository bloat; the v5 model dimensions and feature geometry are unchanged.
          EOF
          sed -i 's/^          //' "$PKG/README.md"

          (
            cd "$PKG"
            find STL Source -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

          rm -f "$ZIP_PATH"
          (
            cd "$(dirname "$PKG")"
            zip -9 -qr "$GITHUB_WORKSPACE/$ZIP_PATH" "$(basename "$PKG")"
          )

          unzip -t "$ZIP_PATH"
          sha256sum "$ZIP_PATH"

          cat >> tools/README.md <<'EOF'

          ## Echo Gen 2 pogo-pin carrier (v5)

          [`libreecho-echo-gen2-pogo-plug-v5.zip`](./libreecho-echo-gen2-pogo-plug-v5.zip) contains the printable six-pin carrier used to make a repeatable development/service jig for the Echo 2nd Gen base contacts. It replaces the original rounded-rectangle rubber plug while positioning six spring probes over the 2 × 3 contact array.

          The model is based on measured hardware dimensions: 3.0 mm pin pitch, approximately 0.66 mm pogo barrels, a 10.0 × 7.6 mm clearance lid, an 8.8 × 6.0 mm insert body, a 5.0 mm insert depth and a 2.0 mm lid. The gold contacts were estimated to sit roughly another 2 mm below the top of the pogo cage, so verify tip projection and compression against the physical device before wiring or powering the jig.

          v5 is specifically designed for a 0.4 mm FDM nozzle. Instead of relying on marginal 0.68–0.75 mm printed holes, it uses flared through-channels and provides 0.80, 0.90, 1.00, 1.10 and 1.20 mm bore variants plus a calibration coupon. Print the coupon first; 1.00 mm is the recommended starting carrier for the measured 0.66 mm pins. If adhesive is required, use only a small amount at the wiring-side pocket and keep it clear of the moving plunger.

          This is a hardware-development aid, not a required part of the LibreEcho software installation path.
          EOF
          sed -i '/^          /s/^          //' tools/README.md

          rm -rf tools/.pogo-v5-upload
          rm -f .github/workflows/pogo-v5-materialise.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools .github/workflows/pogo-v5-materialise.yml
          git commit -m "tools: add Echo Gen 2 pogo plug v5"
          git push origin HEAD:tools/pogo-plug-v5
