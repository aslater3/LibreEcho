name: Public release gate

on:
  pull_request:
    paths:
      - 'release/**'
      - 'tools/prepare-release.py'
      - 'build/ci/prepare-stable-release.py'
      - 'build/ci/generate-release-notes.py'
      - 'build/tests/test_release_packaging.py'
      - 'build/tests/test_generate_release_notes.py'
      - 'tools/prepare-sbom.py'
      - 'tools/check-release-components.py'
      - 'tools/test_release_tools.py'
      - 'tools/libreecho-install.py'
      - 'tools/libreecho-install.py.sha256'
      - 'tools/test_initial_installer_publication.py'
      - '.github/workflows/release-gate.yml'
      - '.github/workflows/publish-release.yml'
  push:
    branches: [main]
    paths:
      - 'release/**'
      - 'tools/prepare-release.py'
      - 'build/ci/prepare-stable-release.py'
      - 'build/ci/generate-release-notes.py'
      - 'build/tests/test_release_packaging.py'
      - 'build/tests/test_generate_release_notes.py'
      - 'tools/prepare-sbom.py'
      - 'tools/check-release-components.py'
      - 'tools/test_release_tools.py'
      - 'tools/libreecho-install.py'
      - 'tools/libreecho-install.py.sha256'
      - 'tools/test_initial_installer_publication.py'
      - '.github/workflows/release-gate.yml'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Validate metadata JSON
        run: |
          python -m json.tool release/components.json >/dev/null
          python -m json.tool release/provenance.schema.json >/dev/null
      - name: Compile release generators
        run: |
          python -m py_compile \
            tools/prepare-release.py \
            build/ci/prepare-stable-release.py \
            build/ci/generate-release-notes.py \
            build/tests/test_release_packaging.py \
            build/tests/test_generate_release_notes.py \
            tools/prepare-sbom.py \
            tools/check-release-components.py \
            tools/check-public-metadata.py \
            tools/test_release_tools.py \
            tools/libreecho-install.py \
            tools/test_initial_installer_publication.py
      - name: Reject private identifiers in public metadata
        run: python3 tools/check-public-metadata.py
      - name: Enforce full component and SBOM gate
        run: python -m unittest tools.test_release_tools
      - name: Verify commercially unrestricted component gate
        run: |
          python3 tools/check-release-components.py \
            --release-scope commercially-unrestricted

      - name: Verify community noncommercial component gate
        run: |
          python3 tools/check-release-components.py \
            --release-scope community-noncommercial
      - name: Verify public installer mirror
        run: python -B -m unittest tools.test_initial_installer_publication -v
