name: Hosted LibreEcho build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: libreecho-main-build
  cancel-in-progress: false
  queue: max

jobs:
  resolve-and-preflight:
    runs-on: ubuntu-24.04
    outputs:
      product_sha: ${{ steps.resolve.outputs.product_sha }}
      platform_sha: ${{ steps.resolve.outputs.platform_sha }}
      linux_sha: ${{ steps.resolve.outputs.linux_sha }}
      ui_sha: ${{ steps.resolve.outputs.ui_sha }}
      source_set_id: ${{ steps.resolve.outputs.source_set_id }}
      version: ${{ steps.resolve.outputs.version }}
      mode: ${{ steps.resolve.outputs.mode }}
      channel: ${{ steps.resolve.outputs.channel }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {fetch-depth: 1, persist-credentials: false}
      - id: resolve
        env:
          PRODUCT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$GITHUB_BASE_REF" == main ]]
          else
            [[ "$GITHUB_REF" == refs/heads/main ]]
          fi
          p=$(git ls-remote https://github.com/aslater3/LibreEcho-Platform.git refs/heads/main | cut -f1)
          l=$(git ls-remote https://github.com/aslater3/LibreEcho-Linux-6.1.git refs/heads/main | cut -f1)
          u=$(git ls-remote https://github.com/aslater3/LibreEcho-UI.git refs/heads/main | cut -f1)
          args=(--product "$PRODUCT_SHA" --platform "$p" --linux "$l" --ui "$u")
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            args+=(--version "$VERSION")
          fi
          python3 build/ci/resolve-source-set.py "${args[@]}" >> "$GITHUB_OUTPUT"

  prepare-public-inputs:
    needs: resolve-and-preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Fetch public input inventory
        run: python3 build/ci/fetch-public-deps.py build/inputs/public-inputs.json --allow-generated --output "$RUNNER_TEMP/public-deps"
      - name: Build public ARM32 musl toolchain
        run: build/ci/build-public-toolchain.sh "$RUNNER_TEMP/toolchain"
      - name: Record toolchain identity
        run: printf '%s\n' 227df8b99103f9c59f6570babf892978e293082f > "$RUNNER_TEMP/toolchain/TOOLCHAIN_SOURCE_COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-deps-${{ needs.resolve-and-preflight.outputs.source_set_id }}
          path: ${{ runner.temp }}/public-deps
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-toolchain-${{ needs.resolve-and-preflight.outputs.source_set_id }}
          path: ${{ runner.temp }}/toolchain
          if-no-files-found: error


  build-image:
    needs: [resolve-and-preflight, prepare-public-inputs]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve-and-preflight.outputs.product_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: aslater3/LibreEcho-Platform
          ref: ${{ needs.resolve-and-preflight.outputs.platform_sha }}
          path: sources/platform
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: aslater3/LibreEcho-Linux-6.1
          ref: ${{ needs.resolve-and-preflight.outputs.linux_sha }}
          path: sources/linux
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: aslater3/LibreEcho-UI
          ref: ${{ needs.resolve-and-preflight.outputs.ui_sha }}
          path: sources/ui
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: aslater3/LibreEcho
          ref: ${{ needs.resolve-and-preflight.outputs.product_sha }}
          path: sources/product
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: public-deps-${{ needs.resolve-and-preflight.outputs.source_set_id }}
          path: ${{ runner.temp }}/public-deps
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: public-toolchain-${{ needs.resolve-and-preflight.outputs.source_set_id }}
          path: ${{ runner.temp }}/toolchain
      - name: Restore executable toolchain bits
        run: find "$RUNNER_TEMP/toolchain/bin" "$RUNNER_TEMP/toolchain/usr/bin" -type f -exec chmod 0755 {} +
      - name: Restore component cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/component-cache
          key: libreecho-components-v5-${{ runner.os }}-${{ needs.resolve-and-preflight.outputs.source_set_id }}-${{ hashFiles('build/build.sh', 'build/component-cache.py', 'build/ci/build-public-neural-deps.sh', 'build/inputs/public-inputs.json') }}
          restore-keys: |
            libreecho-components-v5-${{ runner.os }}-
      - name: Install public ARMHF build packages
        run: |
          set -euo pipefail
          apt_root="$RUNNER_TEMP/armhf-apt"
          debs="$RUNNER_TEMP/armhf-debs"
          mkdir -p "$apt_root/lists/partial" "$debs"
          printf '%s\n' \
            'deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble main universe multiverse restricted' \
            'deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe multiverse restricted' \
            > "$RUNNER_TEMP/armhf.sources.list"
          apt_opts=(
            -o Dir::Etc::sourcelist="$RUNNER_TEMP/armhf.sources.list"
            -o Dir::Etc::sourceparts=-
            -o Dir::State::lists="$apt_root/lists"
            -o Dir::Cache::archives="$debs"
            -o APT::Architecture=armhf
          )
          apt-get "${apt_opts[@]}" update
          cd "$debs"
          apt-get download "${apt_opts[@]}" \
            libasound2-dev:armhf avahi-daemon:armhf \
            libavahi-client-dev:armhf libavahi-common-dev:armhf \
            libdbus-1-dev:armhf dbus-daemon:armhf
          cd "$RUNNER_TEMP"
          apt-get download gcc-13-arm-linux-gnueabihf g++-13-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf libc6-dev-armhf-cross
          for deb in "$debs"/*.deb "$RUNNER_TEMP"/*.deb; do
            dpkg-deb -x "$deb" "$RUNNER_TEMP/armhf-root"
          done
          for tool in gcc g++ cpp; do
            ln -sfn "arm-linux-gnueabihf-${tool}-13" \
              "$RUNNER_TEMP/armhf-root/usr/bin/arm-linux-gnueabihf-${tool}"
          done
      - name: Stage public ARMHF AirPlay sysroot
        run: |
          set -euo pipefail
          sysroot="$RUNNER_TEMP/public-deps/airplay-sysroot"
          mkdir -p "$sysroot"
          cp -a "$RUNNER_TEMP/armhf-root/." "$sysroot/"
          for path in /usr/arm-linux-gnueabihf /usr/lib/gcc-cross/arm-linux-gnueabihf; do
            if [[ -e "$path" ]]; then
              mkdir -p "$RUNNER_TEMP/public-deps/host-cross$(dirname "$path")"
              cp -a "$path" "$RUNNER_TEMP/public-deps/host-cross$(dirname "$path")/"
            fi
          done
      - name: Build public neural dependencies
        env:
          JOBS: "2"
          LIBREECHO_NEURAL_CROSS: ${{ runner.temp }}/armhf-root/usr/bin/arm-linux-gnueabihf-
        run: build/ci/build-public-neural-deps.sh "$RUNNER_TEMP/public-deps" "$RUNNER_TEMP/armhf-root"
      - name: Fail closed until hosted builder exists
        run: |
          test -x build/ci/build-public-release.sh
          test -f build/ci/fetch-public-deps.py
          echo 'Hosted public build entrypoint is present.'
      - name: Build image and features
        env:
          LIBREECHO_PUBLIC_DEPS_ROOT: ${{ runner.temp }}/public-deps
          LIBREECHO_KERNEL_SRC: ${{ github.workspace }}/sources/linux
          LIBREECHO_TOOLING_SRC: ${{ github.workspace }}/sources/platform
          LIBREECHO_UI_SRC: ${{ github.workspace }}/sources/ui
          LIBREECHO_PRODUCT_SRC: ${{ github.workspace }}/sources/product
          LIBREECHO_KERNEL_OUT: ${{ runner.temp }}/kernel-out
          LIBREECHO_COMPONENT_CACHE_ROOT: ${{ runner.temp }}/component-cache
          LIBREECHO_REUSE_COMPONENT_CACHE: "1"
          LIBREECHO_CORE_RUNTIME_SYSROOT: ${{ runner.temp }}/armhf-root/usr/arm-linux-gnueabihf
          LIBREECHO_CORE_GCC_LIBDIR: ${{ runner.temp }}/armhf-root/usr/lib/gcc-cross/arm-linux-gnueabihf/13
          CROSS: ${{ runner.temp }}/armhf-root/usr/bin/arm-linux-gnueabihf-
          AUDIO_CC: ${{ runner.temp }}/toolchain/usr/bin/armv7-alpine-linux-musleabihf-gcc
          LIBREECHO_MUSL_CROSS_PREFIX: ${{ runner.temp }}/toolchain/bin/arm-linux-musleabihf-
          LIBREECHO_OTA_MUSL_NATIVE_ROOT: ${{ runner.temp }}/toolchain
          LIBREECHO_OTA_MUSL_SYSROOT: ${{ runner.temp }}/toolchain/arm-linux-musleabihf
          LIBREECHO_BUSYBOX_SOURCE_ARCHIVE: ${{ runner.temp }}/public-deps/busybox-1.37.0.tar.bz2
          LIBREECHO_MUSL_SOURCE_ARCHIVE: ${{ runner.temp }}/public-deps/musl-1.2.5.tar.gz
          LIBREECHO_WPA_SUPPLICANT_SOURCE_ARCHIVE: ${{ runner.temp }}/public-deps/wpa_supplicant-2.10.tar.gz
          LIBREECHO_WIRELESS_TOOLS_SOURCE_ARCHIVE: ${{ runner.temp }}/public-deps/wireless-tools_30~pre9.orig.tar.gz
          LIBREECHO_WIRELESS_REGDB_SOURCE_ARCHIVE: ${{ runner.temp }}/public-deps/wireless-regdb-2025.10.07.tar.xz
          LIBREECHO_LIBSODIUM_SOURCE_ARCHIVE: ${{ runner.temp }}/public-deps/libsodium-1.0.18.tar.gz
          LIBREECHO_ADBD_SOURCE: ${{ runner.temp }}/public-deps/aosp-system-core
          LIBREECHO_ADBD_KERNEL_HEADERS: ${{ github.workspace }}/sources/linux
          LIBREECHO_UI_CROSS: ${{ runner.temp }}/toolchain/usr/bin/armv7-alpine-linux-musleabihf-
          LIBREECHO_TTS_NORTHERN_MALE_MODEL: ${{ runner.temp }}/public-deps/northern-male.optimized.onnx
          LIBREECHO_TTS_FEMALE_MODEL: ${{ runner.temp }}/public-deps/northern-male.optimized.onnx
          LIBREECHO_TTS_TOKENS: ${{ runner.temp }}/public-deps/tokens.txt
          LIBREECHO_STT_MODEL_ROOT: ${{ runner.temp }}/public-deps
          LIBREECHO_WAKE_ORT_SOURCE: ${{ runner.temp }}/public-deps/onnxruntime-source
          LIBREECHO_ORT_BUILD: ${{ runner.temp }}/public-deps/neural/onnxruntime-build
          LIBREECHO_ORT_PREFIX: ${{ runner.temp }}/public-deps/neural/onnxruntime-prefix
          LIBREECHO_WAKE_FLATBUFFERS_PYTHON: ${{ runner.temp }}/public-deps/neural/flatbuffers-python
          LIBREECHO_SHERPA_SOURCE: ${{ runner.temp }}/public-deps/sherpa-onnx-source
          LIBREECHO_SHERPA_PREFIX: ${{ runner.temp }}/public-deps/neural/sherpa-onnx-prefix
          LIBREECHO_ESPEAK_SOURCE: ${{ runner.temp }}/public-deps/espeak-ng-source
          LIBREECHO_TTS_ESPEAK_DATA: ${{ runner.temp }}/public-deps/espeak-ng-source/espeak-ng-data
          LIBREECHO_AIRPLAY_SYSROOT: ${{ runner.temp }}/public-deps/airplay-sysroot
          LIBREECHO_FLITE_SOURCE: ${{ runner.temp }}/public-deps/flite-source
          LIBREECHO_SPEEX_PREFIX: ${{ runner.temp }}/public-deps/neural/speexdsp-prefix
        run: build/ci/build-public-release.sh --release-output image-and-features --no-publish

  publish-dev:
    if: github.event_name == 'push'
    needs: [resolve-and-preflight, build-image]
    runs-on: ubuntu-24.04
    environment: development-signing
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Publish
        run: python3 build/ci/publish-release.py publish-dev

  publish-production:
    if: github.event_name == 'workflow_dispatch'
    needs: [resolve-and-preflight, build-image]
    runs-on: ubuntu-24.04
    environment: production-signing
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Publish
        run: python3 build/ci/publish-release.py publish-production --version '${{ inputs.version }}'
