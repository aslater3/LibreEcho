name: Publish authorised verified 0.13.18
on:
  push:
    branches: ['fix/0.13.18-release-dispatch']
    paths: ['.github/workflows/publish-authorised-01318.yml']
permissions:
  actions: read
  contents: write
concurrency:
  group: stable-release-release/0.13.18
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'aslater3/LibreEcho' && github.ref == 'refs/heads/fix/0.13.18-release-dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: public-release
    env:
      HEAD_SHA: 1e37a119defa18a06a8f06d42a34f6cf648286e6
      RUN_ID: '35475606605'
      RELEASE_VERSION: '0.13.18'
      RELEASE_TAG: radar-puffin-v0.13.18
      RELEASE_NOTES: release/radar-puffin-v0.13.18.md
      RELEASE_DIR: release-assets
      AMONET_REPOSITORY: https://github.com/aslater3/amonet-k32
      AMONET_TAG: v0.1.0
      AMONET_COMMIT: dfefe52f0eed7296012707cfff1f753b0ea33257
      PLATFORM_HEAD: 262c12a849f88ff6ba4c5a8235e8b2733d44bfae
      LINUX_HEAD: 61d92db00162126e33bf984c9f68eb819bddca19
      UI_HEAD: 49fb7d6401c36e3d9459470a6d12c9f168d884d3
      GH_TOKEN: ${{ github.token }}
      LIBREECHO_OTA_EXPECTED_PUBLIC_KEY_SHA256: ${{ vars.LIBREECHO_OTA_EXPECTED_PUBLIC_KEY_SHA256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1e37a119defa18a06a8f06d42a34f6cf648286e6
          fetch-depth: 1
          persist-credentials: false
      - name: Require successful exact stable build and immutable artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(timeout 30s gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/0.13.18" --jq .object.sha)" = "$HEAD_SHA"
          timeout 30s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > build-run.json
          jq -e --arg sha "$HEAD_SHA" '.status == "completed" and .conclusion == "success" and .head_sha == $sha and .head_branch == "release/0.13.18" and .event == "workflow_dispatch" and .path == ".github/workflows/build-release.yml" and .repository.full_name == "aslater3/LibreEcho"' build-run.json >/dev/null
          timeout 30s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" > build-artifacts.json
          jq -e '[.artifacts[] | select(.id == 10594680195 and .name == "libreecho-0.13.18-1e37a11" and .expired == false and .digest == "sha256:6ff70970f05cc628d844c6e9abc056fe919b220cdfefbdcb1ef2e136dc3891ce")] | length == 1' build-artifacts.json >/dev/null
          timeout 30s gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[] | select(.tag_name == "radar-puffin-v0.13.18") | .id' > existing-release.txt
          test ! -s existing-release.txt
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          repository: aslater3/LibreEcho
          run-id: '35475606605'
          github-token: ${{ github.token }}
          name: libreecho-0.13.18-1e37a11
          path: verified-build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install reviewed verification dependency closure
        run: timeout 120s python -m pip install --disable-pip-version-check --no-index --find-links build/inputs/reviewed/python-wheels --require-hashes --requirement build/inputs/reviewed/python-wheels/requirements.txt
      - name: Bind release request and all four source commits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('verified-build')
          requests = list(root.rglob('release-request.json'))
          assert len(requests) == 1, 'ambiguous release request'
          data = json.loads(requests[0].read_text())
          expected = {'schema':'libreecho-release-request-v1', 'channel':'stable', 'version':'0.13.18', 'release_tag':'radar-puffin-v0.13.18', 'release_notes':os.environ['RELEASE_NOTES'], 'amonet_repository':os.environ['AMONET_REPOSITORY'], 'amonet_tag':os.environ['AMONET_TAG'], 'amonet_commit':os.environ['AMONET_COMMIT'], 'ssh_enabled':'0'}
          assert data == expected, 'stable request mismatch'
          inventories = list(root.rglob('release-source-commits.txt'))
          assert len(inventories) == 1 and inventories[0].parent == requests[0].parent
          sources = dict(line.split('=', 1) for line in inventories[0].read_text().splitlines())
          assert sources == {'product':os.environ['HEAD_SHA'], 'platform':os.environ['PLATFORM_HEAD'], 'linux':os.environ['LINUX_HEAD'], 'ui':os.environ['UI_HEAD']}, 'source set mismatch'
          print('stable_request_and_source_binding=PASS')
          PY
      - name: Run canonical stable asset preparation and verification
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s python3 build/ci/generate-release-notes.py \
            --version "$RELEASE_VERSION" --product-head "$HEAD_SHA" \
            --platform-head "$PLATFORM_HEAD" --linux-head "$LINUX_HEAD" \
            --ui-head "$UI_HEAD" --output "$RELEASE_NOTES"
          timeout 180s python3 build/ci/prepare-stable-release.py \
            --artifact-root verified-build --product-root "$GITHUB_WORKSPACE" \
            --product-commit "$HEAD_SHA" --release-version "$RELEASE_VERSION" \
            --release-notes "$RELEASE_NOTES" --amonet-repository "$AMONET_REPOSITORY" \
            --amonet-tag "$AMONET_TAG" --amonet-commit "$AMONET_COMMIT" \
            --output-dir "$RELEASE_DIR"
          timeout 60s python3 tools/check-public-metadata.py "$RELEASE_DIR"
          (cd "$RELEASE_DIR" && timeout 60s sha256sum -c *-SHA256SUMS)
      - name: Publish through unchanged guarded stable publisher
        run: timeout 240s build/ci/publish-stable-release.sh
      - name: Verify latest release and exact tag target
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s gh api "repos/$GITHUB_REPOSITORY/releases/latest" | jq -e '.tag_name == "radar-puffin-v0.13.18" and .draft == false and .prerelease == false' >/dev/null
          timeout 30s gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" | jq -e --arg sha "$HEAD_SHA" '.object.type == "commit" and .object.sha == $sha' >/dev/null
          echo 'latest_stable_01318=PASS'
